[workspace]
resolver = "2"
members = [
    "crates/nodestor-core",
    "crates/nodestor-scanner",
    "crates/nodestor-formats",
    "crates/nodestor-transport",
    "nodestor-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"
zstd = "0.13"
lz4_flex = "0.11"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
sysinfo = "0.32"
byteorder = "1"
tempfile = "3"
criterion = { version = "0.5" }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
