[workspace]
resolver = "2"
members = [
    "crates/nodestor-core",
    "crates/nodestor-scanner",
    "crates/nodestor-formats",
    "crates/nodestor-transport",
    "crates/nodestor-vulkan",
    "crates/nodestor-streaming",
    "crates/nodestor-metadata",
    "crates/nodestor-inference",
    "crates/nodestor-python",
    "crates/nodestor-davi",
    "nodestor-cli",
    "nodestor-server", "crates/nodestor-gdeflate",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# === Core ===
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# === Vulkan ===
ash = "0.38"
gpu-allocator = "0.27"

# === I/O ===
memmap2 = "0.9"
zstd = "0.13"
lz4_flex = "0.11"

# === Async ===
tokio = { version = "1", features = ["full"] }

# === HTTP ===
axum = "0.8"

# === CLI ===
clap = { version = "4", features = ["derive"] }

# === Hardware Detection ===
sysinfo = "0.32"
byteorder = "1"

# === Utilidades ===
tempfile = "3"
criterion = { version = "0.5" }
dirs = "5"

# === Telemetria ===
opentelemetry = "0.24"
opentelemetry_sdk = "0.24"
opentelemetry-otlp = "0.17"
prometheus = "0.13"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"

[profile.release.build-override]
opt-level = 3
