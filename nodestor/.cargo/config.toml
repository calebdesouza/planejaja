# NodeStor — Cargo workspace configuration
#
# NOTA: target e target-dir são definidos localmente (não commitados) para
# evitar conflitos entre ambientes (Windows dev / Linux VPS / CI).
# No Windows use: CARGO_BUILD_TARGET=x86_64-pc-windows-msvc
# No Linux/VPS: sem target explícito (Rust detecta automaticamente)

# Limita jobs paralelos para não estourar RAM em builds paralelos grandes.
# Ajuste conforme os cores disponíveis (VPS tem mais; remova esta linha lá).
[build]
jobs = 6

[target.x86_64-pc-windows-msvc]
# AVX2 + FMA — Xeon E5-2680 v4 suporta ambos; elimina scalar fallbacks do compilador
rustflags = ["-C", "target-cpu=native"]

[target.x86_64-unknown-linux-gnu]
# AVX2 + FMA para RTX 2080 Ti host (Xeon E5-2697 v4)
rustflags = ["-C", "target-cpu=native", "-C", "opt-level=3"]
