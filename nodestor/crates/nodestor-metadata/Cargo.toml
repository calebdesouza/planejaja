[package]
name = "nodestor-metadata"
version.workspace = true
edition.workspace = true
description = "Metadata engine — LanceDB, DiskANN, Binary Quantization"

[dependencies]
nodestor-core = { path = "../nodestor-core" }
nodestor-formats = { path = "../nodestor-formats" }
futures = "0.3"
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Dependências nativas C++ para Vector DB (opcionais)
lancedb = { version = "0.10", optional = true }
arrow = { version = "51.0", optional = true }

[features]
default = []
lancedb_native = ["lancedb", "arrow"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
